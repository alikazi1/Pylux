name: Build Pylux HDR Build 2

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout Pylux
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            diffutils:p
            fast_float:p
            fftw:p
            hidapi:p
            json-c:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            SDL2:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p

      - name: Install additional tools
        run: |
          pip install protobuf
          pacman -S git make unzip zip jq --noconfirm

      - name: Enable PS Cloud HDR negotiation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("gui/src/settings.cpp")
          s = p.read_text(encoding="utf-8")
          old = "profile.codec = pscloud ? CHIAKI_CODEC_H265 : CHIAKI_CODEC_H264;"
          new = "profile.codec = pscloud ? CHIAKI_CODEC_H265_HDR : CHIAKI_CODEC_H264;"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("Cloud codec line not found")
          p.write_text(s, encoding="utf-8")

          p = Path("lib/src/cloudsession_gaikai.c")
          s = p.read_text(encoding="utf-8")
          old1 = 'json_object_object_add(vss, "supportedDynamicRange", json_object_new_string("sdr"));'
          new1 = 'json_object_object_add(vss, "supportedDynamicRange", json_object_new_string("hdr"));'
          old2 = 'json_object_object_add(vss, "preferredDynamicRange", json_object_new_string("sdr"));'
          new2 = 'json_object_object_add(vss, "preferredDynamicRange", json_object_new_string("hdr"));'
          if old1 in s:
              s = s.replace(old1, new1, 1)
          elif new1 not in s:
              raise SystemExit("supportedDynamicRange line not found")
          if old2 in s:
              s = s.replace(old2, new2, 1)
          elif new2 not in s:
              raise SystemExit("preferredDynamicRange line not found")
          p.write_text(s, encoding="utf-8")

          print("PS Cloud HDR negotiation enabled")
          PY

      - name: Show HDR patch
        run: |
          git diff -- gui/src/settings.cpp lib/src/cloudsession_gaikai.c

      - name: Build libplacebo
        run: scripts/build-libplacebo-windows.sh

      - name: Setup FFmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          unzip ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/." /mingw64/bin
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/." /mingw64/include
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/." /mingw64/lib

      - name: Add QML WebEngine import
        run: cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Configure
        run: |
          cmake -S . -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHIAKI_ENABLE_CLI=OFF \
            -DCHIAKI_ENABLE_STEAMWORKS=OFF \
            -DCHIAKI_ENABLE_STEAM_SHORTCUT=ON

      - name: Build
        run: cmake --build build --config Release --clean-first --target chiaki

      - name: Package portable app
        run: |
          mkdir -p pylux-hdr-build2
          cp build/gui/chiaki.exe pylux-hdr-build2/pylux-hdr-build2.exe

          export PATH="${GITHUB_WORKSPACE}/build/third-party/cpp-steam-tools:/mingw64/share/qt6/bin:/mingw64/bin:${PATH}"
          export QT_PLUGIN_PATH="/mingw64/share/qt6/plugins"
          export QML2_IMPORT_PATH="/mingw64/share/qt6/qml"

          windeployqt6.exe --no-translations --qmldir=gui/src/qml pylux-hdr-build2/pylux-hdr-build2.exe

          echo pylux-hdr-build2/pylux-hdr-build2.exe > tmp0.txt
          while [ -e tmp0.txt ] && [ -s tmp0.txt ]; do
            cp tmp0.txt tmp.txt
            rm -f tmp0.txt
            sort -u tmp.txt -o tmp.txt
            ldd $(<tmp.txt) 2>/dev/null | awk '($2 == "=>") { print $3 }' | while read -r dep; do
              case "$dep" in
                ""|*"/Windows/"*|*"/WINDOWS/"*|*"/System32/"*|*"/SYSTEM32/"*|*"/SysWOW64/"*|*"/SYSWOW64/"*)
                  continue
                  ;;
              esac
              if [ -f "$dep" ] && [ ! -e "pylux-hdr-build2/${dep##*/}" ]; then
                cp "$dep" pylux-hdr-build2/
                echo "$dep" >> tmp0.txt
              fi
            done
          done
          rm -f tmp0.txt tmp.txt
          zip -r Pylux-HDR-Build2-Windows.zip pylux-hdr-build2

      - name: Upload HDR Build 2
        uses: actions/upload-artifact@v4
        with:
          name: Pylux-HDR-Build2-Windows
          path: Pylux-HDR-Build2-Windows.zip
          if-no-files-found: error
