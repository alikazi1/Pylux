name: Build Pylux HDR Build 3 Diagnostic

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout Pylux
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            diffutils:p
            fast_float:p
            fftw:p
            hidapi:p
            json-c:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            SDL2:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p

      - name: Install additional tools
        run: |
          pip install protobuf
          pacman -S git make unzip zip jq --noconfirm

      - name: Apply HDR diagnostic patch
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Force cloud decoder/profile to H265_HDR
          p = Path("gui/src/settings.cpp")
          s = p.read_text(encoding="utf-8")
          old = "profile.codec = pscloud ? CHIAKI_CODEC_H265 : CHIAKI_CODEC_H264;"
          new = "profile.codec = pscloud ? CHIAKI_CODEC_H265_HDR : CHIAKI_CODEC_H264;"
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit("Cloud codec line not found")
          p.write_text(s, encoding="utf-8")

          # 2) Force Gaikai dynamic range request to uppercase HDR
          p = Path("lib/src/cloudsession_gaikai.c")
          s = p.read_text(encoding="utf-8")

          replacements = [
              (
                  'json_object_object_add(vss, "supportedDynamicRange", json_object_new_string("sdr"));',
                  'json_object_object_add(vss, "supportedDynamicRange", json_object_new_string("HDR"));'
              ),
              (
                  'json_object_object_add(vss, "preferredDynamicRange", json_object_new_string("sdr"));',
                  'json_object_object_add(vss, "preferredDynamicRange", json_object_new_string("HDR"));'
              ),
          ]
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit(f"Expected line not found: {old}")

          # Add a safe request-side log right after videoStreamSettings is attached.
          anchor = 'json_object_object_add(s, "videoStreamSettings", vss);'
          logline = '''json_object_object_add(s, "videoStreamSettings", vss);
\t\tCHIAKI_LOGI(c->log, "[GAIKAI][HDR-DIAG] request dynamic range: supported=HDR preferred=HDR, profile=hevc_hw4, resolution=%d", ch);'''
          if logline not in s:
              if anchor not in s:
                  raise SystemExit("videoStreamSettings anchor not found")
              s = s.replace(anchor, logline, 1)

          # Add a safe response-side diagnostic that does NOT print auth or handshake values.
          anchor2 = 'out->launch_spec = strdup(cc_json_str(a, "launchSpecification"));'
          diag = r'''out->launch_spec = strdup(cc_json_str(a, "launchSpecification"));
		const char *ls_diag = cc_json_str(a, "launchSpecification");
		CHIAKI_LOGI(c->log,
			"[GAIKAI][HDR-DIAG] launchSpecification markers: HDR=%s SDR=%s hevc=%s avc=%s dynamicRange=%s",
			(ls_diag && strstr(ls_diag, "HDR")) ? "yes" : "no",
			(ls_diag && strstr(ls_diag, "SDR")) ? "yes" : "no",
			(ls_diag && strstr(ls_diag, "hevc")) ? "yes" : "no",
			(ls_diag && strstr(ls_diag, "avc")) ? "yes" : "no",
			(ls_diag && strstr(ls_diag, "dynamicRange")) ? "present" : "absent");'''
          if diag not in s:
              if anchor2 not in s:
                  raise SystemExit("launchSpecification anchor not found")
              s = s.replace(anchor2, diag, 1)

          p.write_text(s, encoding="utf-8")
          print("Applied Build 3 HDR diagnostic patch.")
          PY

      - name: Show patch
        run: |
          git diff -- gui/src/settings.cpp lib/src/cloudsession_gaikai.c

      - name: Build libplacebo
        run: scripts/build-libplacebo-windows.sh

      - name: Setup FFmpeg
        run: |
          curl -LO https://github.com/streetpea/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          unzip ffmpeg-n7.1-latest-win64-gpl-shared-7.1.zip
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/bin/." /mingw64/bin
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/include/." /mingw64/include
          cp -a "ffmpeg-n7.1-latest-win64-gpl-shared-7.1/lib/." /mingw64/lib

      - name: Add QML WebEngine import
        run: cp scripts/qtwebengine_import.qml gui/src/qml/

      - name: Configure
        run: |
          cmake -S . -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHIAKI_ENABLE_CLI=OFF \
            -DCHIAKI_ENABLE_STEAMWORKS=OFF \
            -DCHIAKI_ENABLE_STEAM_SHORTCUT=ON

      - name: Build
        run: cmake --build build --config Release --clean-first --target chiaki

      - name: Package portable app
        run: |
          mkdir -p pylux-hdr-build3
          cp build/gui/chiaki.exe pylux-hdr-build3/pylux-hdr-build3.exe

          export PATH="${GITHUB_WORKSPACE}/build/third-party/cpp-steam-tools:/mingw64/share/qt6/bin:/mingw64/bin:${PATH}"
          export QT_PLUGIN_PATH="/mingw64/share/qt6/plugins"
          export QML2_IMPORT_PATH="/mingw64/share/qt6/qml"

          windeployqt6.exe --no-translations --qmldir=gui/src/qml pylux-hdr-build3/pylux-hdr-build3.exe

          echo pylux-hdr-build3/pylux-hdr-build3.exe > tmp0.txt
          while [ -e tmp0.txt ] && [ -s tmp0.txt ]; do
            cp tmp0.txt tmp.txt
            rm -f tmp0.txt
            sort -u tmp.txt -o tmp.txt
            ldd $(<tmp.txt) 2>/dev/null | awk '($2 == "=>") { print $3 }' | while read -r dep; do
              case "$dep" in
                ""|*"/Windows/"*|*"/WINDOWS/"*|*"/System32/"*|*"/SYSTEM32/"*|*"/SysWOW64/"*|*"/SYSWOW64/"*)
                  continue
                  ;;
              esac
              if [ -f "$dep" ] && [ ! -e "pylux-hdr-build3/${dep##*/}" ]; then
                cp "$dep" pylux-hdr-build3/
                echo "$dep" >> tmp0.txt
              fi
            done
          done
          rm -f tmp0.txt tmp.txt
          zip -r Pylux-HDR-Build3-Diagnostic-Windows.zip pylux-hdr-build3

      - name: Upload HDR Build 3
        uses: actions/upload-artifact@v4
        with:
          name: Pylux-HDR-Build3-Diagnostic-Windows
          path: Pylux-HDR-Build3-Diagnostic-Windows.zip
          if-no-files-found: error
